<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection de sables</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--accent:#b45309}*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif;color:var(--ink)}#map{position:fixed;inset:0}.panel{position:absolute;z-index:1000;top:12px;left:12px;width:390px;max-height:calc(100vh - 24px);overflow:auto;background:#fff;padding:15px;border-radius:16px;box-shadow:0 5px 25px #0002}.title{font-size:19px;font-weight:800}.subtitle,.status,.small{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.stat{background:#f7f7f5;border:1px solid var(--line);border-radius:10px;padding:8px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.search,select{width:100%;padding:9px;border:1px solid #d7dbe0;border-radius:9px;margin-top:7px;background:#fff}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.btn{border:0;background:var(--ink);color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:11px}.btn.secondary{background:#eee;color:#222}.btn.active{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #f59e0b66}.section{font-size:11px;font-weight:800;margin-top:13px;padding-top:10px;border-top:1px solid var(--line)}.item{padding:8px 7px;font-size:11px;cursor:pointer;border-radius:8px;border-left:3px solid transparent}.item:hover,.item.active{background:#f1f1f1;border-left-color:var(--accent)}.item b{font-size:12px}.coords{color:#777;font-size:10px;margin-top:2px}.sample-marker{background:transparent;border:0}.sample-marker span{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:9px;line-height:1;border:3px solid #fff;box-shadow:0 2px 8px #0005;white-space:nowrap}.sample-marker.selected span{background:var(--accent);transform:scale(1.2)}.sample-id{font-size:18px;font-weight:800}.photo{max-width:260px;max-height:190px;width:auto;border-radius:8px;margin:8px 0;display:block;object-fit:cover}.photo-empty{font-size:11px;color:#999;margin:7px 0}@media(max-width:600px){.panel{width:calc(100vw - 24px);max-height:52vh;top:6px;left:6px}}</style></head><body><div class="panel"><div class="title">🌍 Collection de sables</div><div class="subtitle">Atlas personnel de prélèvements</div><div class="stats"><div class="stat"><b id="total">0</b><span>échantillons</span></div><div class="stat"><b id="countries">0</b><span>pays</span></div><div class="stat"><b id="years">0</b><span>années</span></div></div><input id="search" class="search" placeholder="🔎 Rechercher ID, lieu, pays, voyage…"><div class="filters"><select id="country"><option value="">Tous les pays</option></select><select id="year"><option value="">Toutes les années</option></select></div><div class="row"><button class="btn" id="reset">🌎 Vue mondiale</button><button class="btn secondary" id="latest">📅 Dernier prélèvement</button><button class="btn secondary" id="sat">🛰 Satellite</button><button class="btn secondary" id="refresh">↻ Actualiser</button><button class="btn secondary" id="geo">GeoJSON</button><button class="btn secondary" id="kml">KML</button></div><div id="status" class="status">Chargement…</div><div id="insights" class="small" style="margin-top:7px"></div><div class="section">📋 Mes échantillons</div><div id="list"></div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — OpenStreetMap contributors'}),satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}),map=L.map('map',{worldCopyJump:true}).setView([20,0],2),layer=L.layerGroup().addTo(map);street.addTo(map);let samples=[],markers=new Map(),satOn=false;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(s){return String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function split(line,sep){let o=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'&&line[i+1]==='"'&&q){c+='"';i++}else if(x==='"')q=!q;else if(x===sep&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}function parse(text){text=text.replace(/^\uFEFF/,'');const lines=text.split(/\r?\n/).filter(Boolean);if(!lines.length)return[];const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const h=split(lines[0],sep).map(x=>norm(x.replace(/^"|"$/g,''))),a={id:['id','id echantillon','n echantillon'],place:['lieu precis','lieu'],country:['pays','country'],date:['date de prelevement','date'],lat:['latitude','lat'],lng:['longitude','lng'],trip:['voyage','trip'],notes:['notes','remarques']},ix={};for(const k in a)ix[k]=h.findIndex(v=>a[k].includes(v));const out=[];for(let i=1;i<lines.length;i++){const v=split(lines[i],sep),s={};for(const k in a)s[k]=ix[k]>=0?(v[ix[k]]||'').trim().replace(/^"|"$/g,''):'';const la=parseFloat(s.lat.replace(',','.')),lo=parseFloat(s.lng.replace(',','.'));if(Number.isFinite(la)&&Number.isFinite(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180){s.lat=la;s.lng=lo;s.id=s.id||String(i);out.push(s)}}return out}function photoHtml(s){if(!s.id)return'';const base='https://raw.githubusercontent.com/ufteee/collection-sables/main/photos/';return['jpg','jpeg','png','webp'].map(e=>'<img class="photo" src="'+base+encodeURIComponent(s.id)+'.'+e+'" loading="lazy" alt="Photo '+esc(s.id)+'" onerror="this.remove()">').join('')}function popup(s){return '<div class="sample-id">🏖️ '+esc(s.id)+'</div>'+photoHtml(s)+(s.date?'<div><b>Date du prélèvement :</b> '+esc(s.date)+'</div>':'<div><b>Date du prélèvement :</b> —</div>')+'<div><b>Pays :</b> '+esc(s.country||'—')+'</div>'+(s.place?'<div><b>Lieu :</b> '+esc(s.place)+'</div>':'')+'<div><b>GPS :</b> '+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+'</div>'+(s.trip?'<div><b>Voyage :</b> '+esc(s.trip)+'</div>':'')+(s.notes?'<div style="margin-top:6px">'+esc(s.notes)+'</div>':'')}function icon(s,sel){let label=String(s.id||'');return L.divIcon({className:'sample-marker'+(sel?' selected':''),html:'<span>'+esc(label)+'</span>',iconSize:[46,46],iconAnchor:[23,23]})}function select(id){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',e.dataset.id===id))}function focus(id){const s=samples.find(x=>x.id===id),m=markers.get(id);if(!s||!m)return;select(id);map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),9),{duration:.6});m.setIcon(icon(s,true));setTimeout(()=>m.openPopup(),500)}function fill(id,vals,label){const e=$(id),cur=e.value;e.innerHTML='<option value="">'+label+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join('');if(vals.includes(cur))e.value=cur}function render(list,fit){layer.clearLayers();markers.clear();list.forEach(s=>{const m=L.marker([s.lat,s.lng],{icon:icon(s,false),title:s.id}).bindPopup(popup(s));m.on('click',()=>{select(s.id);m.setIcon(icon(s,true))});m.on('popupclose',()=>m.setIcon(icon(s,false)));markers.set(s.id,m);m.addTo(layer)});$('total').textContent=samples.length;$('countries').textContent=new Set(samples.map(s=>s.country).filter(Boolean)).size;$('years').textContent=new Set(samples.map(s=>(s.date||'').slice(-4)).filter(x=>/^\d{4}$/.test(x))).size;$('list').innerHTML=list.map(s=>'<div class="item" data-id="'+esc(s.id)+'"><b>🏖️ '+esc(s.id)+'</b><div class="coords">'+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+(s.place?' — '+esc(s.place):'')+(s.country?' · '+esc(s.country):'')+'</div></div>').join('');document.querySelectorAll('.item').forEach(e=>e.onclick=()=>focus(e.dataset.id));if(fit&&list.length)map.fitBounds(L.latLngBounds(list.map(s=>[s.lat,s.lng])).pad(.15),{maxZoom:7});$('insights').textContent=list.length+' résultat(s) affiché(s).'}function filtered(){const q=norm($('search').value),c=$('country').value,y=$('year').value;return samples.filter(s=>(!q||norm(Object.values(s).join(' ')).includes(q))&&(!c||s.country===c)&&(!y||(s.date||'').slice(-4)===y))}function refreshFilters(){fill('country',[...new Set(samples.map(s=>s.country).filter(Boolean))].sort(),'Tous les pays');fill('year',[...new Set(samples.map(s=>(s.date||'').slice(-4)).filter(x=>/^\d{4}$/.test(x)))].sort().reverse(),'Toutes les années')}async function load(){try{$('status').textContent='Actualisation…';const r=await fetch('https://raw.githubusercontent.com/ufteee/collection-sables/main/data.csv?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);samples=parse(await r.text());refreshFilters();render(filtered(),true);$('status').textContent=samples.length+' échantillon(s) — '+new Date().toLocaleTimeString('fr-FR')}catch(e){$('status').textContent='Erreur : '+e.message}}function latest(){const a=samples.filter(s=>s.date);if(!a.length){alert('Aucune date de prélèvement renseignée.');return}const s=a.reduce((x,y)=>new Date(x.date)>new Date(y.date)?x:y);$('search').value='';$('country').value='';$('year').value='';render([s],true);focus(s.id)}function satelliteToggle(){satOn=!satOn;if(satOn){map.removeLayer(street);satellite.addTo(map);$('sat').classList.add('active')}else{map.removeLayer(satellite);street.addTo(map);$('sat').classList.remove('active')}}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}function geo(){download('collection-sables.geojson',JSON.stringify({type:'FeatureCollection',features:samples.map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[s.lng,s.lat]},properties:{id:s.id,pays:s.country,lieu:s.place,date:s.date,voyage:s.trip}}))},null,2),'application/geo+json')}function kml(){download('collection-sables.kml','<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+samples.map(s=>'<Placemark><name>'+esc(s.id)+'</name><description>'+esc([s.place,s.country,s.date,s.trip].filter(Boolean).join(' — '))+'</description><Point><coordinates>'+s.lng+','+s.lat+',0</coordinates></Point></Placemark>').join('')+'</Document></kml>','application/vnd.google-earth.kml+xml')}$('refresh').onclick=load;$('latest').onclick=latest;$('sat').onclick=satelliteToggle;$('reset').onclick=()=>{['search','country','year'].forEach(id=>$(id).value='');render(samples,true);map.setView([20,0],2)};$('geo').onclick=geo;$('kml').onclick=kml;$('search').oninput=()=>render(filtered());['country','year'].forEach(id=>$(id).onchange=()=>render(filtered()));load();setInterval(load,30000);</script></body></html>
