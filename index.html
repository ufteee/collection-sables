<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection de sables — Carte</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}.panel{position:absolute;z-index:1000;top:14px;left:14px;background:#fff;padding:15px;border-radius:14px;box-shadow:0 3px 18px #0003;width:350px;max-height:calc(100vh - 40px);overflow:auto}.search{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px}.row{display:flex;gap:7px;margin-top:8px}.btn{border:0;background:#1f2937;color:#fff;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px}.btn.secondary{background:#eee;color:#222}.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:999px;margin:8px 0;font-size:12px}.status{font-size:11px;color:#555;margin-top:8px}.small{font-size:12px;color:#666;line-height:1.4}.sample-marker{background:transparent;border:0}.sample-marker span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#1f2937;color:#fff;font-weight:700;font-size:11px;border:3px solid #fff;box-shadow:0 2px 8px #0005}.sample-marker.selected span{background:#b45309;transform:scale(1.15)}.sample-id{font-size:18px;font-weight:700;margin-bottom:7px}.list{margin-top:10px;border-top:1px solid #eee;padding-top:8px}.item{padding:8px 6px;font-size:12px;cursor:pointer;border-radius:7px}.item:hover,.item.active{background:#f1f1f1}.item b{font-size:13px}</style></head><body><div class="panel"><b>🌍 Collection de sables</b><div class="small">Synchronisation automatique avec GitHub.</div><div id="count" class="badge">0 échantillon</div><input id="search" class="search" placeholder="Rechercher ID, lieu, pays…"><div class="row"><button class="btn" id="reset">Vue mondiale</button><button class="btn secondary" id="refresh">Actualiser</button><button class="btn secondary" id="load">CSV local</button></div><input id="file" type="file" accept=".csv,text/csv" hidden><div id="status" class="status">Chargement…</div><div id="list" class="list"></div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{worldCopyJump:true}).setView([20,0],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, OpenStreetMap contributors, GIS User Community'}).addTo(map);const layer=L.layerGroup().addTo(map);let samples=[];let markersById=new Map();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function popup(s){return '<div class="sample-id">🏖️ '+esc(s.id)+'</div><div>GPS : '+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+'</div>'+(s.place?'<div>Lieu : '+esc(s.place)+'</div>':'')+(s.country?'<div>Pays : '+esc(s.country)+'</div>':'')+(s.date?'<div>Date : '+esc(s.date)+'</div>':'')}function iconFor(s,i,selected=false){let n=(s.id||('S-'+String(i+1).padStart(4,'0'))).replace(/^S-/i,'');return L.divIcon({className:'sample-marker'+(selected?' selected':''),html:'<span>'+esc(n)+'</span>',iconSize:[38,38],iconAnchor:[19,19]})}function focusSample(id){const s=samples.find(x=>x.id===id);const m=markersById.get(id);if(!s||!m)return;document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',e.dataset.id===id));map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),8),{duration:.7});setTimeout(()=>m.openPopup(),350)}function render(list,fit=false){layer.clearLayers();markersById.clear();const ms=list.map((s,i)=>{const m=L.marker([s.lat,s.lng],{icon:iconFor(s,i),title:s.id}).bindPopup(popup(s));m.on('click',()=>{document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',e.dataset.id===s.id));m.setIcon(iconFor(s,i,true))});m.on('popupclose',()=>m.setIcon(iconFor(s,i,false)));markersById.set(s.id,m);return m});ms.forEach(m=>m.addTo(layer));document.getElementById('count').textContent=list.length+' échantillon'+(list.length>1?'s':'');const ul=document.getElementById('list');ul.innerHTML=list.map(s=>'<div class="item" data-id="'+esc(s.id)+'"><b>🏖️ '+esc(s.id)+'</b> — '+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+'</div>').join('');ul.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>focusSample(el.dataset.id)));if(fit&&ms.length)map.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())).pad(.15),{maxZoom:7})}function split(line,sep){let o=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'&&line[i+1]==='"'&&q){c+='"';i++}else if(x==='"')q=!q;else if(x===sep&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}function parse(text){text=text.replace(/^\uFEFF/,'');let lines=text.split(/\r?\n/).filter(Boolean);if(!lines.length)return[];let sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';let h=split(lines[0],sep).map(x=>x.trim().replace(/^"|"$/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let al={id:['id','id echantillon','n echantillon','no echantillon'],place:['place','lieu precis','lieu'],country:['country','pays'],date:['date','date de prelevement'],lat:['lat','latitude','latitude (°)'],lng:['lng','longitude','longitude (°)']};let ix={};for(let k in al)ix[k]=h.findIndex(v=>al[k].includes(v));let out=[];for(let i=1;i<lines.length;i++){let v=split(lines[i],sep),s={};for(let k in al)s[k]=ix[k]>=0?(v[ix[k]]||'').trim().replace(/^"|"$/g,''):'';let la=parseFloat(s.lat.replace(',','.')),lo=parseFloat(s.lng.replace(',','.'));if(Number.isFinite(la)&&Number.isFinite(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180){s.lat=la;s.lng=lo;if(!s.id)s.id='S-'+String(i).padStart(4,'0');out.push(s)}}return out}async function loadRemote(){const st=document.getElementById('status');st.textContent='Actualisation…';try{const url='https://raw.githubusercontent.com/ufteee/collection-sables/main/data.csv?cb='+Date.now();const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);const text=await r.text();const oldIds=new Set(samples.map(s=>s.id));samples=parse(text);render(samples,true);const newIds=samples.filter(s=>!oldIds.has(s.id)).map(s=>s.id);st.textContent=samples.length+' point(s) chargé(s) — '+newIds.length+' nouveau(x) depuis la dernière actualisation.'}catch(e){st.textContent='Erreur de chargement : '+e.message;console.error(e)}}function loadFile(f){const r=new FileReader();r.onload=()=>{samples=parse(r.result);render(samples,true);document.getElementById('status').textContent=samples.length+' point(s) chargés depuis le fichier local.'};r.readAsText(f,'UTF-8')}document.getElementById('refresh').onclick=loadRemote;document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);document.getElementById('reset').onclick=()=>map.setView([20,0],2);document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase().trim();render(q?samples.filter(s=>Object.values(s).join(' ').toLowerCase().includes(q)):samples)};loadRemote();setInterval(loadRemote,30000);</script></body></html>
