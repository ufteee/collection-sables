<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection de sables — Carte interactive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}.panel{position:absolute;z-index:1000;top:14px;left:14px;background:#fff;padding:15px;border-radius:14px;box-shadow:0 3px 18px #0003;width:330px}h1{font-size:19px;margin:0 0 5px}.small{font-size:12px;color:#666;line-height:1.45}.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:999px;margin:8px 0;font-size:12px}.search{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px}.actions{display:flex;gap:7px;margin-top:8px}.btn{border:0;background:#1f2937;color:#fff;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px}.btn.secondary{background:#eee;color:#222}.drop{margin-top:9px;padding:10px;border:1px dashed #aaa;border-radius:8px;font-size:12px;color:#666}.drop.drag{background:#f3f4f6}.status{margin-top:8px;font-size:11px;color:#555}.error{color:#b91c1c}.leaflet-popup-content{font-size:13px;line-height:1.45}.field{margin-top:3px}.label{color:#777}
</style></head><body>
<div class="panel"><h1>🌍 Collection de sables</h1><div class="small">Carte mondiale interactive de tes prélèvements.</div><div id="count" class="badge">0 échantillon</div><input id="search" class="search" placeholder="Rechercher ID, lieu, pays…"><div class="actions"><button class="btn" id="reset">Vue mondiale</button><button class="btn secondary" id="load">Charger un CSV</button></div><input id="file" type="file" accept=".csv,text/csv" hidden><div id="drop" class="drop">Glisse ici ton CSV exporté depuis Excel, ou clique sur « Charger un CSV ».</div><div id="status" class="status">Aucun fichier chargé. Tu peux charger data.csv.</div></div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([20,0],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, OpenStreetMap contributors, GIS User Community'}).addTo(map);
let samples=[];const layer=L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:9});map.addLayer(layer);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function popup(s){let x='<b>🏖️ '+esc(s.id||'Échantillon')+'</b>';const add=(l,v)=>{if(v)x+=`<div class="field"><span class="label">${l} :</span> ${esc(v)}</div>`};add('Lieu',s.place);add('Pays',s.country);add('Région',s.region);add('Prélèvement',s.date);add('Type',s.type);add('Couleur',s.color);add('Granulométrie',s.grain);add('Texture',s.texture);add('Composition',s.composition);add('Quantité',s.quantity);add('Contenant',s.container);add('Photo',s.photo);add('Notes',s.notes);add('Emplacement',s.location);x+=`<div class="field"><span class="label">GPS :</span> ${Number(s.lat).toFixed(6)}, ${Number(s.lng).toFixed(6)}</div>`;return x}
function render(list,fit=false){layer.clearLayers();const ms=list.map(s=>L.marker([Number(s.lat),Number(s.lng)]).bindPopup(popup(s)));layer.addLayers(ms);document.getElementById('count').textContent=list.length.toLocaleString('fr-FR')+' échantillon'+(list.length>1?'s':'');if(fit&&ms.length){const b=L.latLngBounds(ms.map(m=>m.getLatLng()));map.fitBounds(b.pad(.15),{maxZoom:7})}}
function splitLine(line,sep){const out=[];let cell='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&q){cell+='"';i++}else if(c==='"'){q=!q}else if(c===sep&&!q){out.push(cell);cell=''}else cell+=c}out.push(cell);return out}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const lines=[];let cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){q=!q;cur+=c}else if((c==='\n'||c==='\r')&&!q){if(cur.trim()!=='')lines.push(cur);cur='';if(c==='\r'&&text[i+1]==='\n')i++}else cur+=c}if(cur.trim()!=='')lines.push(cur);if(!lines.length)return[];const first=lines[0],commas=(first.match(/,/g)||[]).length,semis=(first.match(/;/g)||[]).length,sep=semis>commas?';':',';const headers=splitLine(first,sep).map(x=>x.trim().replace(/^"|"$/g,''));const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const H=headers.map(norm);const aliases={id:['id','id echantillon'],date:['date','date de prelevement'],country:['country','pays'],region:['region','region / etat'],place:['place','lieu precis','lieu'],type:['type','type de lieu'],lat:['lat','latitude','latitude (°)'],lng:['lng','longitude','longitude (°)'],context:['context','contexte / plage / desert / riviere…','contexte'],color:['color','couleur'],grain:['grain','granulometrie'],texture:['texture','aspect / texture'],composition:['composition','composition supposee'],quantity:['quantity','quantite prelevee'],container:['container','contenant'],photo:['photo','photos'],notes:['notes','remarques'],location:['location','emplacement collection']};const idx={};for(const k in aliases)idx[k]=H.findIndex(h=>aliases[k].includes(h));const rows=[];for(let i=1;i<lines.length;i++){const vals=splitLine(lines[i],sep),o={};for(const k in aliases)o[k]=idx[k]>=0?(vals[idx[k]]||'').trim().replace(/^"|"$/g,''):'';const lat=parseFloat(String(o.lat).replace(',','.')),lng=parseFloat(String(o.lng).replace(',','.'));if(Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180){o.lat=lat;o.lng=lng;rows.push(o)}}return rows}
function loadFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=parseCSV(reader.result);samples=parsed;render(samples,true);document.getElementById('status').textContent=`${file.name} chargé : ${parsed.length.toLocaleString('fr-FR')} point(s) géolocalisé(s).`;document.getElementById('status').className='status'+(parsed.length?'':' error')}catch(e){document.getElementById('status').textContent='Erreur de lecture du CSV : '+e.message;document.getElementById('status').className='status error'}};reader.readAsText(file,'UTF-8')}
document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);document.getElementById('reset').onclick=()=>{map.setView([20,0],2);render(samples,false)};document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase().trim();render(!q?samples:samples.filter(s=>Object.values(s).join(' ').toLowerCase().includes(q)),false)};const drop=document.getElementById('drop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
</script></body></html>
