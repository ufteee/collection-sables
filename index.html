<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection de sables — Atlas</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#1f2937;--muted:#667085;--line:#e5e7eb;--paper:#fff;--accent:#b45309;--soft:#f7f7f5}*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:Inter,Arial,sans-serif;color:var(--ink)}#map{position:fixed;inset:0}.panel{position:absolute;z-index:1000;top:12px;left:12px;width:390px;max-height:calc(100vh - 24px);overflow:auto;background:rgba(255,255,255,.97);padding:15px;border-radius:16px;box-shadow:0 5px 25px #0002}.title{font-size:19px;font-weight:800}.subtitle{font-size:11px;color:var(--muted);margin:3px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.search{width:100%;padding:9px;border:1px solid #d7dbe0;border-radius:9px;margin-top:10px}.row{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.btn{border:0;background:var(--ink);color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:11px}.btn.secondary{background:#eee;color:#222}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.filters select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:11px}.status{font-size:10px;color:var(--muted);margin-top:8px}.section{font-size:11px;font-weight:800;margin-top:13px;padding-top:10px;border-top:1px solid var(--line)}.list{margin-top:6px}.item{padding:8px 7px;font-size:11px;cursor:pointer;border-radius:8px;border-left:3px solid transparent}.item:hover,.item.active{background:#f1f1f1;border-left-color:var(--accent)}.item b{font-size:12px}.coords{color:#777;font-size:10px;margin-top:2px}.sample-marker{background:transparent;border:0}.sample-marker span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:10px;border:3px solid #fff;box-shadow:0 2px 8px #0005}.sample-marker.selected span{background:var(--accent);transform:scale(1.2)}.sample-id{font-size:18px;font-weight:800;margin-bottom:7px}.popup img{max-width:230px;max-height:150px;border-radius:8px;margin-top:7px}.legend{font-size:10px;color:#777;margin-top:7px}@media(max-width:600px){.panel{width:calc(100vw - 24px);max-height:48vh;top:6px;left:6px}}
</style></head><body><div class="panel"><div class="title">🌍 Collection de sables</div><div class="subtitle">Atlas personnel de prélèvements</div><div class="stats"><div class="stat"><b id="total">0</b><span>échantillons</span></div><div class="stat"><b id="countries">0</b><span>pays</span></div><div class="stat"><b id="years">0</b><span>années</span></div></div><input id="search" class="search" placeholder="🔎 Rechercher ID, lieu, pays, voyage…"><div class="filters"><select id="country"><option value="">Tous les pays</option></select><select id="type"><option value="">Tous les types</option></select><select id="year"><option value="">Toutes les années</option></select><select id="continent"><option value="">Tous les continents</option></select></div><div class="row"><button class="btn" id="reset">🌎 Vue mondiale</button><button class="btn secondary" id="refresh">↻ Actualiser</button><button class="btn secondary" id="sat">🛰 Satellite</button><button class="btn secondary" id="geo">GeoJSON</button><button class="btn secondary" id="kml">KML</button></div><input id="file" type="file" accept=".csv,text/csv" hidden><div class="row"><button class="btn secondary" id="load">📄 CSV local</button></div><div id="status" class="status">Chargement…</div><div class="section">📊 Collection</div><div id="insights" class="legend"></div><div class="section">📋 Mes échantillons</div><div id="list" class="list"></div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, OpenStreetMap contributors'});const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});const map=L.map('map',{worldCopyJump:true}).setView([20,0],2);street.addTo(map);const layer=L.layerGroup().addTo(map);let samples=[],markersById=new Map(),satOn=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function val(s,names){for(const n of names){if(s[n]!=null&&String(s[n]).trim())return String(s[n]).trim()}return ''}function popup(s){const photo=val(s,['photo','photo echantillon','image','image url','photo url']);return '<div class="popup"><div class="sample-id">🏖️ '+esc(s.id)+'</div>'+['place','country','date','type','continent','trip','color','grain','composition','origin','comment'].map(k=>s[k]?'<div><b>'+k+':</b> '+esc(s[k])+'</div>':'').join('')+'<div><b>GPS:</b> '+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+'</div>'+(photo&&/^https?:\/\//i.test(photo)?'<img src="'+esc(photo)+'" alt="Photo">':'')+'</div>'}function iconFor(s,i,selected=false){let n=(s.id||('S-'+String(i+1).padStart(6,'0'))).replace(/^S-/i,'');return L.divIcon({className:'sample-marker'+(selected?' selected':''),html:'<span>'+esc(n)+'</span>',iconSize:[38,38],iconAnchor:[19,19]})}function selectItem(id){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active',e.dataset.id===id))}function focusSample(id){const s=samples.find(x=>x.id===id),m=markersById.get(id);if(!s||!m)return;selectItem(id);map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),9),{duration:.6});m.setIcon(iconFor(s,samples.indexOf(s),true));setTimeout(()=>m.openPopup(),500)}function render(list,fit=false){layer.clearLayers();markersById.clear();const ms=list.map((s,i)=>{const m=L.marker([s.lat,s.lng],{icon:iconFor(s,i),title:s.id}).bindPopup(popup(s));m.on('click',()=>{selectItem(s.id);m.setIcon(iconFor(s,i,true));setTimeout(()=>m.openPopup(),0)});m.on('popupclose',()=>m.setIcon(iconFor(s,i,false)));markersById.set(s.id,m);return m});ms.forEach(m=>m.addTo(layer));document.getElementById('total').textContent=samples.length;document.getElementById('countries').textContent=new Set(samples.map(s=>s.country).filter(Boolean)).size;document.getElementById('years').textContent=new Set(samples.map(s=>(s.date||'').slice(-4)).filter(x=>/^\d{4}$/.test(x))).size;document.getElementById('list').innerHTML=list.map(s=>'<div class="item" data-id="'+esc(s.id)+'"><b>🏖️ '+esc(s.id)+'</b><div class="coords">'+s.lat.toFixed(6)+', '+s.lng.toFixed(6)+(s.place?' — '+esc(s.place):'')+(s.country?' · '+esc(s.country):'')+'</div></div>').join('');document.querySelectorAll('.item').forEach(e=>e.onclick=()=>focusSample(e.dataset.id));const countries=[...new Set(samples.map(s=>s.country).filter(Boolean))].sort();const types=[...new Set(samples.map(s=>s.type).filter(Boolean))].sort();const years=[...new Set(samples.map(s=>(s.date||'').slice(-4)).filter(x=>/^\d{4}$/.test(x)))].sort().reverse();const continents=[...new Set(samples.map(s=>s.continent).filter(Boolean))].sort();fill('country',countries);fill('type',types);fill('year',years);fill('continent',continents);const byCountry={};samples.forEach(s=>{if(s.country)byCountry[s.country]=(byCountry[s.country]||0)+1});const top=Object.entries(byCountry).sort((a,b)=>b[1]-a[1])[0];document.getElementById('insights').textContent=top?'Pays le plus représenté : '+top[0]+' ('+top[1]+') — '+list.length+' résultat(s) affiché(s).':list.length+' résultat(s) affiché(s).';if(fit&&ms.length)map.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())).pad(.15),{maxZoom:7})}function fill(id,arr){const el=document.getElementById(id),cur=el.value;el.innerHTML='<option value="">'+({country:'Tous les pays',type:'Tous les types',year:'Toutes les années',continent:'Tous les continents'}[id])+'</option>'+arr.map(x=>'<option>'+esc(x)+'</option>').join('');if(arr.includes(cur))el.value=cur}function split(line,sep){let o=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'&&line[i+1]==='"'&&q){c+='"';i++}else if(x==='"')q=!q;else if(x===sep&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}function parse(text){text=text.replace(/^\uFEFF/,'');let lines=text.split(/\r?\n/).filter(Boolean);if(!lines.length)return[];let sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';let h=split(lines[0],sep).map(x=>x.trim().replace(/^"|"$/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let aliases={id:['id','id echantillon','n echantillon','no echantillon'],place:['place','lieu precis','lieu'],country:['country','pays'],date:['date','date de prelevement'],lat:['lat','latitude','latitude (°)'],lng:['lng','longitude','longitude (°)'],type:['type','type de lieu','milieu'],continent:['continent'],trip:['trip','voyage'],color:['color','couleur'],grain:['grain','granulometrie','granulometrie'],composition:['composition'],origin:['origin','origine'],comment:['comment','commentaire','description'],photo:['photo','photo echantillon','image','image url','photo url']};let ix={};for(let k in aliases)ix[k]=h.findIndex(v=>aliases[k].includes(v));let out=[];for(let i=1;i<lines.length;i++){let v=split(lines[i],sep),s={};for(let k in aliases)s[k]=ix[k]>=0?(v[ix[k]]||'').trim().replace(/^"|"$/g,''):'';let la=parseFloat(s.lat.replace(',','.')),lo=parseFloat(s.lng.replace(',','.'));if(Number.isFinite(la)&&Number.isFinite(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180){s.lat=la;s.lng=lo;if(!s.id)s.id='S-'+String(i).padStart(6,'0');out.push(s)}}return out}function filtered(){const q=document.getElementById('search').value.toLowerCase().trim(),c=document.getElementById('country').value,t=document.getElementById('type').value,y=document.getElementById('year').value,co=document.getElementById('continent').value;return samples.filter(s=>(!q||Object.values(s).join(' ').toLowerCase().includes(q))&&(!c||s.country===c)&&(!t||s.type===t)&&(!y||(s.date||'').slice(-4)===y)&&(!co||s.continent===co))}function apply(){render(filtered())}async function loadRemote(){const st=document.getElementById('status');st.textContent='Actualisation…';try{const r=await fetch('https://raw.githubusercontent.com/ufteee/collection-sables/main/data.csv?cb='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);samples=parse(await r.text());render(filtered(),!document.getElementById('search').value);st.textContent=samples.length+' échantillon(s) — synchronisé avec GitHub. '+new Date().toLocaleTimeString('fr-FR')}catch(e){st.textContent='Erreur : '+e.message}}function loadFile(f){const r=new FileReader();r.onload=()=>{samples=parse(r.result);render(samples,true);document.getElementById('status').textContent=samples.length+' échantillon(s) chargés depuis le CSV local.'};r.readAsText(f,'UTF-8')}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function geojson(){download('collection-sables.geojson',JSON.stringify({type:'FeatureCollection',features:samples.map(s=>({type:'Feature',geometry:{type:'Point',coordinates:[s.lng,s.lat]},properties:{...s,lat:undefined,lng:undefined}}))},null,2),'application/geo+json')}function kml(){download('collection-sables.kml','<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>'+samples.map(s=>'<Placemark><name>'+esc(s.id)+'</name><description>'+esc([s.place,s.country,s.date,s.comment].filter(Boolean).join(' — '))+'</description><Point><coordinates>'+s.lng+','+s.lat+',0</coordinates></Point></Placemark>').join('')+'</Document></kml>','application/vnd.google-earth.kml+xml')}document.getElementById('refresh').onclick=loadRemote;document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);document.getElementById('reset').onclick=()=>map.setView([20,0],2);document.getElementById('sat').onclick=()=>{satOn=!satOn;if(satOn){map.removeLayer(street);satellite.addTo(map)}else{map.removeLayer(satellite);street.addTo(map)}};document.getElementById('geo').onclick=geojson;document.getElementById('kml').onclick=kml;document.getElementById('search').oninput=apply;['country','type','year','continent'].forEach(id=>document.getElementById(id).onchange=apply);loadRemote();setInterval(loadRemote,30000);
</script></body></html>
