<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection de sables — Carte</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif}.panel{position:absolute;z-index:1000;top:14px;left:14px;background:white;padding:15px;border-radius:14px;box-shadow:0 3px 18px #0003;width:340px}.search{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ddd;border-radius:8px}.row{display:flex;gap:7px;margin-top:8px}.btn{border:0;background:#1f2937;color:#fff;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px}.btn.secondary{background:#eee;color:#222}.badge{display:inline-block;background:#eee;padding:5px 9px;border-radius:999px;margin:8px 0;font-size:12px}.status{font-size:11px;color:#555;margin-top:8px}.small{font-size:12px;color:#666;line-height:1.4}.leaflet-popup-content{font-size:13px;line-height:1.45}.label{color:#777}</style></head><body><div class="panel"><b>🌍 Collection de sables</b><div class="small">La carte charge automatiquement <b>data.csv</b> depuis GitHub.</div><div id="count" class="badge">0 échantillon</div><input id="search" class="search" placeholder="Rechercher ID, lieu, pays…"><div class="row"><button class="btn" id="reset">Vue mondiale</button><button class="btn secondary" id="refresh">Actualiser</button><button class="btn secondary" id="load">CSV local</button></div><input id="file" type="file" accept=".csv,text/csv" hidden><div id="status" class="status">Chargement…</div></div><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script>
const map=L.map('map',{worldCopyJump:true}).setView([20,0],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, OpenStreetMap contributors, GIS User Community'}).addTo(map);const layer=L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:9,showCoverageOnHover:false,spiderfyOnMaxZoom:true,zoomToBoundsOnClick:true});map.addLayer(layer);let samples=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function popup(s){let x='<b>🏖️ '+esc(s.id||'Échantillon')+'</b>';const a=(l,v)=>{if(v)x+=`<div><span class="label">${l} :</span> ${esc(v)}</div>`};a('Lieu',s.place);a('Pays',s.country);a('Région',s.region);a('Date',s.date);a('Type',s.type);a('Couleur',s.color);a('Granulométrie',s.grain);a('Texture',s.texture);a('Composition',s.composition);a('Quantité',s.quantity);a('Contenant',s.container);a('Notes',s.notes);a('Emplacement',s.location);x+=`<div><span class="label">GPS :</span> ${Number(s.lat).toFixed(6)}, ${Number(s.lng).toFixed(6)}</div>`;return x}
function render(list,fit=false){layer.clearLayers();const ms=list.map((s,i)=>L.marker([+s.lat,+s.lng],{title:(s.id||('Échantillon '+(i+1)))}).bindPopup(popup(s)));layer.addLayers(ms);document.getElementById('count').textContent=list.length.toLocaleString('fr-FR')+' échantillon'+(list.length>1?'s':'');if(fit&&ms.length)map.fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())).pad(.15),{maxZoom:7})}
function split(line,sep){let o=[],c='',q=false;for(let i=0;i<line.length;i++){let x=line[i];if(x==='"'&&line[i+1]==='"'&&q){c+='"';i++}else if(x==='"')q=!q;else if(x===sep&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}function parse(text){text=text.replace(/^\uFEFF/,'');let lines=text.split(/\r?\n/).filter(Boolean);if(!lines.length)return[];let sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';let h=split(lines[0],sep).map(x=>x.trim().replace(/^"|"$/g,'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let al={id:['id','id echantillon'],date:['date','date de prelevement'],country:['country','pays'],region:['region','region / etat'],place:['place','lieu precis','lieu'],type:['type','type de lieu'],lat:['lat','latitude','latitude (°)'],lng:['lng','longitude','longitude (°)'],color:['color','couleur'],grain:['grain','granulometrie'],texture:['texture','aspect / texture'],composition:['composition','composition supposee'],quantity:['quantity','quantite prelevee'],container:['container','contenant'],notes:['notes','remarques'],location:['location','emplacement collection']};let ix={};for(let k in al)ix[k]=h.findIndex(v=>al[k].includes(v));let out=[];for(let i=1;i<lines.length;i++){let v=split(lines[i],sep),s={};for(let k in al)s[k]=ix[k]>=0?(v[ix[k]]||'').trim().replace(/^"|"$/g,''):'';let la=parseFloat(s.lat.replace(',','.')),lo=parseFloat(s.lng.replace(',','.'));if(Number.isFinite(la)&&Number.isFinite(lo)&&la>=-90&&la<=90&&lo>=-180&&lo<=180){s.lat=la;s.lng=lo;out.push(s)}}return out}
async function loadRemote(){let st=document.getElementById('status');st.textContent='Actualisation…';try{let url='https://raw.githubusercontent.com/ufteee/collection-sables/main/data.csv?ts='+Date.now();let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);let text=await r.text();samples=parse(text);render(samples,true);st.textContent=`${samples.length.toLocaleString('fr-FR')} point(s) chargé(s) depuis GitHub — ${new Set(samples.map(s=>s.lat+','+s.lng)).size} position(s) distincte(s).`}catch(e){st.textContent='Impossible de charger data.csv. Utilise « CSV local » pour tester.';console.error(e)}}
function loadFile(f){let r=new FileReader();r.onload=()=>{samples=parse(r.result);render(samples,true);document.getElementById('status').textContent=`${samples.length.toLocaleString('fr-FR')} point(s) chargés depuis le fichier local.`};r.readAsText(f,'UTF-8')}
document.getElementById('refresh').onclick=loadRemote;document.getElementById('load').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);document.getElementById('reset').onclick=()=>map.setView([20,0],2);document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase().trim();render(q?samples.filter(s=>Object.values(s).join(' ').toLowerCase().includes(q)):samples)};loadRemote();
</script></body></html>
